# 项目端口
server.port=8080
server.forward-headers-strategy=framework
server.tomcat.mbeanregistry.enabled=true
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:250}
server.tomcat.threads.min-spare=${SERVER_TOMCAT_THREADS_MIN_SPARE:20}
server.tomcat.accept-count=${SERVER_TOMCAT_ACCEPT_COUNT:800}
server.tomcat.max-connections=${SERVER_TOMCAT_MAX_CONNECTIONS:4096}
server.tomcat.connection-timeout=${SERVER_TOMCAT_CONNECTION_TIMEOUT:5s}
server.tomcat.keep-alive-timeout=${SERVER_TOMCAT_KEEP_ALIVE_TIMEOUT:30s}

# MySQL数据库配置
# 支持通过环境变量或 JVM -D 参数覆盖，避免组员反复修改受版本控制的配置文件
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
# 数据库连接地址 & 开启 Unicode 字符集支持 & 指定字符编码为 UTF-8 & 关闭 SSL 加密连接 & 设置数据库时区为 上海（东八区） & 允许客户端获取 MySQL 的公钥
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:online_exam}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=online-exam-primary
spring.datasource.hikari.minimum-idle=${PRIMARY_DB_MIN_IDLE:8}
spring.datasource.hikari.maximum-pool-size=${PRIMARY_DB_MAX_POOL_SIZE:24}
spring.datasource.hikari.connection-timeout=${PRIMARY_DB_CONNECTION_TIMEOUT:2000}
spring.datasource.hikari.validation-timeout=${PRIMARY_DB_VALIDATION_TIMEOUT:1000}
spring.datasource.hikari.idle-timeout=${PRIMARY_DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${PRIMARY_DB_MAX_LIFETIME:1800000}
spring.datasource.hikari.keepalive-time=${PRIMARY_DB_KEEPALIVE_TIME:300000}
spring.datasource.hikari.leak-detection-threshold=${PRIMARY_DB_LEAK_DETECTION_THRESHOLD:0}

# 日志与观测
logging.level.root=INFO
logging.level.com.test.oes.mapper=INFO
logging.pattern.level=%5p [traceId=%X{traceId:-},spanId=%X{spanId:-}]
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml

# JWT & Spring Security
app.security.jwt.issuer=online-exam-system
app.security.jwt.secret=${JWT_SECRET_BASE64:TXlTdXBlclNlY3JldEtleUZvckpXVFNpZ25pbmdTaG91bGRCZUxvbmdFbm91Z2hGb3JITTJTNQ==}
app.security.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
app.security.jwt.refresh-token-days=${JWT_REFRESH_TOKEN_DAYS:7}
app.security.allowed-origin-patterns=${ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

# Actuator / Prometheus
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.redis.enabled=${APP_CACHE_REDIS_ENABLED:true}
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=online-exam-system-backend
management.metrics.tags.module=backend
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,300ms,500ms,1s,3s
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.tomcat=true
management.metrics.enable.hikaricp=true
management.metrics.enable.http.server.requests=true

# Cache / Redis
app.cache.enabled=${APP_CACHE_ENABLED:true}
app.cache.redis.enabled=${APP_CACHE_REDIS_ENABLED:true}
app.cache.redis.required=${APP_CACHE_REDIS_REQUIRED:false}
app.cache.exam-list.local-ttl=${APP_CACHE_EXAM_LIST_LOCAL_TTL:15s}
app.cache.exam-detail.local-ttl=${APP_CACHE_EXAM_DETAIL_LOCAL_TTL:15s}
app.cache.scope-exams.local-ttl=${APP_CACHE_SCOPE_EXAMS_LOCAL_TTL:30s}
app.cache.scope-exams.redis-ttl=${APP_CACHE_SCOPE_EXAMS_REDIS_TTL:2m}
app.cache.exam-meta.local-ttl=${APP_CACHE_EXAM_META_LOCAL_TTL:60s}
app.cache.exam-meta.redis-ttl=${APP_CACHE_EXAM_META_REDIS_TTL:10m}
app.cache.paper-aggregate.local-ttl=${APP_CACHE_PAPER_AGG_LOCAL_TTL:120s}
app.cache.paper-aggregate.redis-ttl=${APP_CACHE_PAPER_AGG_REDIS_TTL:10m}
app.cache.snapshot.local-ttl=${APP_CACHE_SNAPSHOT_LOCAL_TTL:60s}
app.cache.question-bank.local-ttl=${APP_CACHE_QUESTION_BANK_LOCAL_TTL:30s}
app.cache.draft.persist-interval=${APP_CACHE_DRAFT_PERSIST_INTERVAL:30s}
app.cache.draft.post-exam-ttl=${APP_CACHE_DRAFT_POST_EXAM_TTL:30m}
spring.cache.type=none
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

# RabbitMQ / Phase 6 local broker
spring.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.connection-timeout=${RABBITMQ_CONNECTION_TIMEOUT:5s}
spring.rabbitmq.requested-heartbeat=${RABBITMQ_REQUESTED_HEARTBEAT:30s}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.listener.simple.default-requeue-rejected=${RABBITMQ_DEFAULT_REQUEUE_REJECTED:false}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.concurrency=${RABBITMQ_LISTENER_CONCURRENCY:2}
spring.rabbitmq.listener.simple.max-concurrency=${RABBITMQ_LISTENER_MAX_CONCURRENCY:4}
spring.rabbitmq.listener.simple.prefetch=${RABBITMQ_LISTENER_PREFETCH:20}
spring.rabbitmq.listener.simple.idle-event-interval=${RABBITMQ_LISTENER_IDLE_EVENT_INTERVAL:30s}
management.health.rabbit.enabled=true

# Scheduling
spring.task.scheduling.pool.size=${SPRING_TASK_SCHEDULING_POOL_SIZE:4}
spring.task.scheduling.thread-name-prefix=${SPRING_TASK_SCHEDULING_THREAD_NAME_PREFIX:oes-scheduler-}
spring.task.scheduling.shutdown.await-termination=${SPRING_TASK_SCHEDULING_AWAIT_TERMINATION:true}
spring.task.scheduling.shutdown.await-termination-period=${SPRING_TASK_SCHEDULING_AWAIT_TERMINATION_PERIOD:30s}

# Phase 6 async system
app.async.outbox.poll-interval=${APP_ASYNC_OUTBOX_POLL_INTERVAL:2s}
app.async.outbox.batch-size=${APP_ASYNC_OUTBOX_BATCH_SIZE:50}
app.async.outbox.max-retries=${APP_ASYNC_OUTBOX_MAX_RETRIES:8}
app.async.draft.flush-delay=${APP_ASYNC_DRAFT_FLUSH_DELAY:5s}
app.async.draft.dispatch-batch-size=${APP_ASYNC_DRAFT_DISPATCH_BATCH_SIZE:100}
app.async.consumer.max-retries=${APP_ASYNC_CONSUMER_MAX_RETRIES:3}

app.cache.score-statistics.local-ttl=${APP_CACHE_SCORE_STATISTICS_LOCAL_TTL:30s}
app.cache.score-statistics.redis-ttl=${APP_CACHE_SCORE_STATISTICS_REDIS_TTL:5m}
app.cache.message.local-ttl=${APP_CACHE_MESSAGE_LOCAL_TTL:30s}
app.cache.message.redis-ttl=${APP_CACHE_MESSAGE_REDIS_TTL:5m}

# Database routing
app.datasource.read-routing-enabled=${APP_DB_READ_ROUTING_ENABLED:true}
app.datasource.replica.enabled=${APP_DB_REPLICA_ENABLED:true}
app.datasource.replica.url=${REPLICA_DB_URL:jdbc:mysql://${DB_HOST:localhost}:3307/${DB_NAME:online_exam}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
app.datasource.replica.username=${REPLICA_DB_USERNAME:${DB_USERNAME:root}}
app.datasource.replica.password=${REPLICA_DB_PASSWORD:}
app.datasource.replica.driver-class-name=${REPLICA_DB_DRIVER:com.mysql.cj.jdbc.Driver}
app.datasource.replica.maximum-pool-size=${REPLICA_DB_MAX_POOL_SIZE:12}
app.datasource.replica.minimum-idle=${REPLICA_DB_MIN_IDLE:4}
app.datasource.replica.connection-timeout=${REPLICA_DB_CONNECTION_TIMEOUT:2000}
app.datasource.replica.max-lag-seconds=${REPLICA_DB_MAX_LAG_SECONDS:5}
app.datasource.replica.health-check-interval-ms=${REPLICA_DB_HEALTH_CHECK_INTERVAL_MS:10000}
app.datasource.replica.validation-query=${REPLICA_DB_VALIDATION_QUERY:SELECT 1}
