# 项目端口
server.port=8080

# MySQL数据库配置
spring.datasource.username=root
spring.datasource.password=root
# 数据库连接地址 & 开启 Unicode 字符集支持 & 指定字符编码为 UTF-8 & 关闭 SSL 加密连接 & 设置数据库时区为 上海（东八区） & 允许客户端获取 MySQL 的公钥
spring.datasource.url=jdbc:mysql://localhost:3306/online_exam?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 给数据库操作层（mapper）设置日志级别为：普通信息（info）
logging.level.com.test.oes.mapper=info

# MyBatis-Plus 打印SQL日志
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
