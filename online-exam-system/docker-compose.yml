version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: exam-mysql
    environment:
      MYSQL_ROOT_PASSWORD: '123456'
      MYSQL_DATABASE: 'online_exam'
      MYSQL_CHARSET: 'utf8mb4'
      MYSQL_COLLATION: 'utf8mb4_unicode_ci'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/sql/integrated_init.sql:/docker-entrypoint-initdb.d/01_init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 5s
      timeout: 10s
      retries: 5
    networks:
      - exam-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exam-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/online_exam?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - exam-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: exam-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - exam-network

volumes:
  mysql-data:

networks:
  exam-network:
    driver: bridge